[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditlens"
version = "0.1.0"
description = "EU AI Act compliance scanning engine for GRC platforms"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "AuditLens AI"},
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "supabase>=2.3.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "httpx>=0.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
